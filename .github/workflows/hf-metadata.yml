# Test-only (varnujik fork): inspect Fun-ASR-MLT-Nano ONNX exports.
name: HF metadata
on:
  push:
    branches: [test/hf-metadata]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Languages in official README
        run: curl -fsSL https://huggingface.co/FunAudioLLM/Fun-ASR-MLT-Nano-2512/raw/main/README.md | grep -n -i -E "portug|language|languages|31" | sed 's/^/README /' | head -30
      - name: Candidate repos
        run: |
          for r in aoiandroid/fun-asr-mlt-nano-onnx-int8 luigi000/fun-asr-mlt-nano-onnx-int8 luigi000/fun-asr-mlt-nano-onnx-int8-1024 Oulasong/Funasr_Nano_MLT_ONNX; do
            echo "REPO $r rev=$(curl -fsS https://huggingface.co/api/models/$r | jq -r '.sha + " license=" + ((.cardData.license // "") | tostring) + " created=" + (.createdAt // "")')"
            curl -fsS "https://huggingface.co/api/models/$r/tree/main?recursive=true" | jq -r --arg r "$r" '.[] | select(.type=="file") | "FILE \($r) \(.path) \(.size) \(.lfs.oid // "")"'
            curl -fsSL "https://huggingface.co/$r/raw/main/README.md" | head -60 | sed "s|^|RD $r: |"
          done
