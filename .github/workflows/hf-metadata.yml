# Test-only (varnujik fork): transcribe pt-BR samples with Fun-ASR-MLT-Nano on sherpa-onnx 1.13.6.
name: HF metadata
on:
  push:
    branches: [test/hf-metadata]
permissions:
  contents: read
jobs:
  mlt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Download model
        run: |
          base=https://huggingface.co/luigi000/fun-asr-mlt-nano-onnx-int8/resolve/932d7dbb98623bd31314015b3bc0dac0dcf80acc
          mkdir -p m/tokenizer
          for f in encoder_adaptor.int8.onnx llm.int8.onnx embedding.int8.onnx tokenizer/config.json tokenizer/generation_config.json tokenizer/merges.txt tokenizer/tokenizer.json tokenizer/tokenizer_config.json tokenizer/vocab.json LICENSE; do curl -fsSL -o m/$f $base/$f; done
          sha256sum m/*.onnx m/tokenizer/* m/LICENSE | sed 's/^/SHA /'; stat -c 'SIZE %s %n' m/tokenizer/* m/LICENSE
      - name: Transcribe
        run: |
          mkdir -p /tmp/rt && cd /tmp/rt && npm init -y >/dev/null && npm install sherpa-onnx-node@1.13.6 >/dev/null
          cp $GITHUB_WORKSPACE/.github/asr-test/asr.js /tmp/rt/asr.js
          M=$GITHUB_WORKSPACE/m; W=$GITHUB_WORKSPACE/.github/asr-test
          TAG=mlt-padrao node asr.js $M $W 2>/dev/null
          TAG=mlt-葡萄牙语 FLANG=葡萄牙语 node asr.js $M $W 2>/dev/null
          TAG=mlt-Portuguese FLANG=Portuguese node asr.js $M $W 2>/dev/null
