# Test-only (varnujik fork): verify the HuggingFace Piper faber export runs on sherpa-onnx 1.13.6.
name: HF metadata
on:
  push:
    branches: [test/hf-metadata]
permissions:
  contents: read
jobs:
  faber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Download faber from HuggingFace
        run: |
          base=https://huggingface.co/csukuangfj/vits-piper-pt_BR-faber-medium/resolve/4f385076a8f9d5bc7b4cd9fea4dc77e6e8ca8167
          mkdir -p m/espeak-ng-data/lang/roa
          curl -fsSL -o m/model.onnx $base/pt_BR-faber-medium.onnx
          curl -fsSL -o m/tokens.txt $base/tokens.txt
          for f in intonations phondata phondata-manifest phonindex phontab pt_dict lang/roa/pt lang/roa/pt-BR; do curl -fsSL -o m/espeak-ng-data/$f $base/espeak-ng-data/$f; done
          sha256sum m/model.onnx m/espeak-ng-data/phondata | sed 's/^/SHA /'
          stat -c 'SIZE %s %n' m/model.onnx
      - name: Synthesize with sherpa-onnx-node 1.13.6
        run: |
          npm init -y >/dev/null && npm install sherpa-onnx-node@1.13.6 >/dev/null
          cat > t.js <<'JS'
          const s=require('sherpa-onnx-node');const j=require('path').join;
          (async()=>{const tts=await s.OfflineTts.createAsync({model:{vits:{model:'m/model.onnx',tokens:'m/tokens.txt',dataDir:'m/espeak-ng-data'},numThreads:2,provider:'cpu'},maxNumSentences:1});
          const a=tts.generate({text:'Olá! Esta é uma amostra da voz em português do Brasil.',sid:0,speed:1,enableExternalBuffer:false});
          console.log('RESULT samples',a.samples.length,'seconds',(a.samples.length/a.sampleRate).toFixed(2));
          let e=0;for(const x of a.samples)e+=x*x;console.log('RESULT rms',Math.sqrt(e/a.samples.length).toFixed(4));})().catch(e=>{console.log('RESULT ERROR',e.message);process.exit(1)});
          JS
          node t.js
