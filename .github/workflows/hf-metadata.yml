# Test-only (varnujik fork): pinned revisions and digests for Parakeet / Whisper base.
name: HF metadata
on:
  push:
    branches: [test/hf-metadata]
permissions:
  contents: read
jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8 csukuangfj/sherpa-onnx-whisper-base nvidia/parakeet-tdt-0.6b-v3 openai/whisper-base; do
            echo "REV $r $(curl -fsS https://huggingface.co/api/models/$r | jq -r .sha)"
          done
          for r in csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8 csukuangfj/sherpa-onnx-whisper-base; do
            curl -fsS "https://huggingface.co/api/models/$r/tree/main?recursive=true" | jq -r --arg r "$r" '.[] | select(.type=="file") | "FILE \($r) \(.path) \(.size) \(.lfs.oid // "git")"'
            for f in tokens.txt base-tokens.txt; do s=$(curl -fsSL "https://huggingface.co/$r/resolve/main/$f" 2>/dev/null | sha256sum | cut -c1-64) && echo "SHA $r $f $s"; done
          done
