# Test-only (varnujik fork): search for a Fun-ASR-MLT-Nano ONNX export.
name: HF metadata
on:
  push:
    branches: [test/hf-metadata]
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Search Hugging Face
        run: |
          for q in Fun-ASR-MLT funasr-mlt mlt-nano Fun-ASR-Nano funasr-nano; do
            curl -fsS "https://huggingface.co/api/models?search=$q&limit=50" | jq -r --arg q "$q" '.[] | "HF \($q) \(.id) dl=\(.downloads) \(.lastModified // "")"'
          done
      - name: Search ModelScope
        run: |
          for q in Fun-ASR-MLT FunASR-MLT mlt-nano FunASR-nano-onnx; do
            curl -fsS -X PUT -H 'Content-Type: application/json' "https://www.modelscope.cn/api/v1/dolphin/models" \
              -d "{\"PageSize\":30,\"PageNumber\":1,\"SortBy\":\"Default\",\"Target\":\"\",\"SingleCriterion\":[],\"Name\":\"$q\"}" \
              | jq -r --arg q "$q" '.Data.Model.Models[]? | "MS \($q) \(.Path)/\(.Name)"' || echo "MS $q falhou"
          done
      - name: List files of candidates
        run: |
          for r in FunAudioLLM/Fun-ASR-MLT-Nano-2512 zengshuishui/FunASR-mlt-nano-onnx; do
            curl -fsS "https://huggingface.co/api/models/$r/tree/main?recursive=true" | jq -r --arg r "$r" '.[] | select(.type=="file") | "FILE \($r) \(.path) \(.size)"' || echo "FILE $r inexistente"
          done
          curl -fsS "https://www.modelscope.cn/api/v1/models/zengshuishui/FunASR-nano-onnx/repo/files?Revision=master&Recursive=true" | jq -r '.Data.Files[] | "MSFILE zengshuishui/FunASR-nano-onnx \(.Path) \(.Size)"' || true
